name: live-kick
on:
  schedule:
    # GitHub dropped every live-intraday cron on 2026-11-23, so the day session
    # never started. One repeating expression is retried every 10 minutes.
    # Taipei = UTC+8.
    # Sun 21:00–23:50 UTC = Mon 05:00–07:50, the pre-open bridge.
    # Mon–Fri 00:00–05:50 UTC = 08:00–13:50, the cash session.
    # Mon–Fri 06:40–20:50 UTC = 14:40–04:50, the night session through the next dawn.
    - cron: "*/10 21-23 * * 0"
    - cron: "*/10 0-5 * * 1-5"
    - cron: "40,50 6 * * 1-5"
    - cron: "*/10 7-20 * * 1-5"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dispatch live-intraday unless it is already running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ.get("GITHUB_REPOSITORY", "laskin77/market-dashboard")
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "User-Agent": "market-dashboard-live-kick",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = "https://api.github.com/repos/%s/actions/workflows/live.yml/runs?per_page=15" % repo
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as resp:
              runs = json.loads(resp.read().decode())["workflow_runs"]
          active = [r for r in runs if r.get("status") in ("queued", "in_progress", "pending", "waiting", "requested")]
          print("active", [(r["id"], r["status"], r["created_at"]) for r in active])
          if active:
              print("live-intraday already active")
              raise SystemExit(0)
          body = json.dumps({"ref": "main"}).encode()
          post = urllib.request.Request(
              "https://api.github.com/repos/%s/actions/workflows/live.yml/dispatches" % repo,
              data=body, method="POST", headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(post, timeout=30) as resp:
              print("dispatched", resp.status)
          PY
