name: close
on:
  schedule:
    # Taipei = UTC+8, every 15 minutes from 14:00 to 19:45. On 2026-11-04 the
    # twelve single-minute crons never created a run, while live-intraday's
    # crons did. One repeating expression is the schedule; the night loop also
    # dispatches this workflow when its own close.py fails. Group is "close".
    - cron: "*/15 6-11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: close
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: rebuild close report
        run: python3 live/close.py
      - name: commit close JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data/close.json data/etf.json data/etf_div.json
          git diff --cached --quiet && exit 0
          git commit -m "data: close $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
